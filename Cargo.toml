[package]
name = "ap-midi-osc-bridge"
version = "0.3.4"
edition = "2021"
description = "Profile-driven MIDI to AUTO/PILOT OSC bridge"
license = "MIT"
repository = "https://github.com/Thevetat/flx4-pilot"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
midir = "0.10"
rosc = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
